{% extends "base.html" %}
{% block title %}Graphs{% endblock %}

{% block content %}
<script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

<div style="max-width:1200px; margin:0 auto;">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="m-0">Graphs</h2>
  </div>

  {% if not form_def %}
    <div class="alert alert-warning">No forms exist yet. Create a form first.</div>
  {% else %}

  <div class="card shadow-sm mb-3">
    <div class="card-body">
      <div class="row g-2 align-items-end">
        <div class="col-12 col-md-4">
          <label class="form-label fw-semibold">Form</label>
          <select id="form_id" class="form-select">
            {% for f in forms %}
              <option value="{{ f.id }}" {% if f.id == form_def.id %}selected{% endif %}>
                {{ f.name }}
              </option>
            {% endfor %}
          </select>
        </div>

        <div class="col-6 col-md-4">
          <label class="form-label fw-semibold">X axis</label>
          <select id="x_key" class="form-select">
            {% for fld in fields %}
              <option value="{{ fld.key }}">{{ fld.label }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="col-6 col-md-4">
          <label class="form-label fw-semibold">Y axis</label>
          <select id="y_key" class="form-select">
            {% for fld in fields %}
              <option value="{{ fld.key }}">{{ fld.label }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div class="mt-3 d-flex gap-2">
        <button class="btn btn-primary" id="btnPlot">Plot</button>
        <span class="text-muted" id="meta" style="font-size:12px;"></span>
      </div>
    </div>
  </div>

  <div class="card shadow-sm">
    <div class="card-body">
      <div id="chart" style="min-height:420px;"></div>
    </div>
  </div>

  {% endif %}
</div>

<script>
  let chart = null;

  function renderChart(points){
    const opts = {
      chart: {
        type: "scatter",
        height: 420,
        toolbar: { show: true },
        zoom: { enabled: true },
        animations: { enabled: true, easing: "easeinout", speed: 450 }
      },
      series: [{
        name: "Points",
        data: points.map(p => ({ x: p.x, y: p.y }))
      }],
      xaxis: { tickAmount: 10 },
      yaxis: { tickAmount: 10 },
      grid: { borderColor: "#eef2f7" },
      markers: { size: 4 },
      tooltip: { shared: false }
    };

    if(chart){
      chart.updateOptions(opts, true, true);
    }else{
      chart = new ApexCharts(document.querySelector("#chart"), opts);
      chart.render();
    }
  }

  async function loadAndPlot(){
    const formId = document.getElementById("form_id").value;
    const x = document.getElementById("x_key").value;
    const y = document.getElementById("y_key").value;

    const res = await fetch(`/graphs/data/?form_id=${encodeURIComponent(formId)}&x=${encodeURIComponent(x)}&y=${encodeURIComponent(y)}`);
    const data = await res.json();

    if(!data.ok){
      alert(data.error || "Failed");
      return;
    }
    document.getElementById("meta").textContent = `Showing ${data.count} points`;
    renderChart(data.points);
  }

  document.getElementById("btnPlot")?.addEventListener("click", loadAndPlot);

  // Change form reloads page so field list matches that form
  document.getElementById("form_id")?.addEventListener("change", (e) => {
    const id = e.target.value;
    window.location.href = `/graphs/?form_id=${encodeURIComponent(id)}`;
  });

  // Auto plot on first load
  if(document.getElementById("btnPlot")) loadAndPlot();
</script>

{% endblock %}
