{% load crm_extras %}
<tr id="row-{{ row_obj.id }}">
  {% for key in column_keys %}
    <td>{{ row_obj|get_attr:key }}</td>
  {% endfor %}

<td>
  {% if can_manage %}
    <button
      class="btn btn-sm btn-outline-primary"
      hx-get="{% url 'table_row_edit' selected.key row_obj.id %}"
      hx-target="#row-{{ row_obj.id }}"
      hx-swap="outerHTML">
      Edit
    </button>

    <form
      method="post"
      hx-post="{% url 'table_delete_record' selected.key row_obj.id %}"
      hx-target="#row-{{ row_obj.id }}"
      hx-swap="outerHTML"
      hx-confirm="Are you sure you want to delete this record?"
      style="display:inline;">
      {% csrf_token %}
      <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
    </form>
  {% else %}
    <span class="text-muted">—</span>
  {% endif %}
</td>
</tr>
